<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-bar">
      <h1 class="game-title">TETRIS</h1>
      <select id="skin-select" title="Cambiar skin" aria-label="Tema visual (skin)"></select>
      <button id="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">🌙</button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <form id="name-form" class="name-form hidden">
          <p class="new-record">¡Nuevo record!</p>
          <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
          <button type="submit" id="save-record-btn">Guardar</button>
        </form>

        <div id="overlay-records" class="records"></div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box menu-box">
        <p id="pause-title">PAUSA</p>

        <div class="menu-actions">
          <button id="resume-btn" class="menu-btn primary">Reanudar</button>
          <button id="menu-restart-btn" class="menu-btn">Reiniciar</button>
          <button id="controls-btn" class="menu-btn" aria-expanded="false" aria-controls="menu-controls">Ver controles</button>
        </div>

        <ul id="menu-controls" class="menu-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd><span>Mover pieza</span></li>
          <li><kbd>↑</kbd><kbd>X</kbd><span>Rotar</span></li>
          <li><kbd>↓</kbd><span>Bajar (soft drop)</span></li>
          <li><kbd>Space</kbd><span>Caída instantánea</span></li>
          <li><kbd>P</kbd><kbd>Esc</kbd><span>Pausa</span></li>
        </ul>

        <div class="menu-level">
          <label for="start-level">Nivel inicial</label>
          <select id="start-level"></select>
          <small>Se aplica en la próxima partida</small>
        </div>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div id="start-records" class="records"></div>
        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn" class="link-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
